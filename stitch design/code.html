<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Floating Document Processing Widget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#7f13ec",
                "background-light": "#f7f6f8",
                "background-dark": "#191022",
              },
              fontFamily: {
                "display": ["Manrope", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
            },
          },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-effect {
            background: rgba(25, 16, 34, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .animate-spin-slow {
            animation: spin 2s linear infinite;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen relative overflow-hidden">
<!-- Mock Content to show floating effect -->
<div class="p-10 opacity-20 pointer-events-none">
<div class="max-w-4xl mx-auto space-y-8">
<div class="h-8 w-1/4 bg-gray-400 dark:bg-gray-700 rounded"></div>
<div class="h-64 w-full bg-gray-300 dark:bg-gray-800 rounded-xl"></div>
<div class="grid grid-cols-3 gap-4">
<div class="h-32 bg-gray-300 dark:bg-gray-800 rounded-lg"></div>
<div class="h-32 bg-gray-300 dark:bg-gray-800 rounded-lg"></div>
<div class="h-32 bg-gray-300 dark:bg-gray-800 rounded-lg"></div>
</div>
</div>
</div>
<!-- Floating Widget Container -->
<div class="fixed bottom-8 right-8 z-50 flex flex-col items-end gap-4 w-[400px]">
<!-- Expanded Detail Panel -->
<div class="w-full glass-effect rounded-xl shadow-2xl overflow-hidden flex flex-col border border-white/5">
<!-- Header Controls -->
<div class="flex items-center justify-between px-4 py-3 border-b border-white/10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-xl">account_tree</span>
<h3 class="text-white text-sm font-bold leading-tight tracking-tight">Processing Details</h3>
</div>
<div class="flex items-center gap-1">
<button class="p-1.5 hover:bg-white/10 rounded-full transition-colors text-[#ab9db9]">
<span class="material-symbols-outlined text-lg">minimize</span>
</button>
<button class="p-1.5 hover:bg-white/10 rounded-full transition-colors text-[#ab9db9]">
<span class="material-symbols-outlined text-lg">close</span>
</button>
</div>
</div>
<!-- Scrollable Content -->
<div class="max-h-[400px] overflow-y-auto">
<!-- List Item: Completed -->
<div class="flex items-center gap-4 px-4 min-h-[72px] py-2 justify-between border-b border-white/5 hover:bg-white/5 transition-colors">
<div class="flex items-center gap-4">
<div class="text-white flex items-center justify-center rounded-lg bg-primary/20 shrink-0 size-12">
<span class="material-symbols-outlined text-primary">picture_as_pdf</span>
</div>
<div class="flex flex-col justify-center">
<p class="text-white text-sm font-medium leading-normal line-clamp-1">Office_Supplies.pdf</p>
<p class="text-[#ab9db9] text-xs font-normal leading-normal line-clamp-2">Completed</p>
</div>
</div>
<div class="shrink-0">
<div class="text-green-400 flex size-7 items-center justify-center">
<span class="material-symbols-outlined text-xl">check_circle</span>
</div>
</div>
</div>
<!-- List Item: Processing (75%) -->
<div class="flex items-center gap-4 px-4 min-h-[72px] py-2 justify-between border-b border-white/5 hover:bg-white/5 transition-colors">
<div class="flex items-center gap-4 flex-1">
<div class="text-white flex items-center justify-center rounded-lg bg-white/10 shrink-0 size-12">
<span class="material-symbols-outlined text-white/70">picture_as_pdf</span>
</div>
<div class="flex flex-col justify-center flex-1">
<div class="flex justify-between items-center mb-1">
<p class="text-white text-sm font-medium leading-normal line-clamp-1">Walmart_Receipt.pdf</p>
<p class="text-white text-xs font-medium leading-normal">75%</p>
</div>
<div class="w-full overflow-hidden rounded-full bg-white/10 h-1.5">
<div class="h-full rounded-full bg-primary" style="width: 75%;"></div>
</div>
</div>
</div>
</div>
<!-- List Item: Processing (45%) -->
<div class="flex items-center gap-4 px-4 min-h-[72px] py-2 justify-between border-b border-white/5 hover:bg-white/5 transition-colors">
<div class="flex items-center gap-4 flex-1">
<div class="text-white flex items-center justify-center rounded-lg bg-white/10 shrink-0 size-12">
<span class="material-symbols-outlined text-white/70">image</span>
</div>
<div class="flex flex-col justify-center flex-1">
<div class="flex justify-between items-center mb-1">
<p class="text-white text-sm font-medium leading-normal line-clamp-1">Gas_Station.png</p>
<p class="text-white text-xs font-medium leading-normal">45%</p>
</div>
<div class="w-full overflow-hidden rounded-full bg-white/10 h-1.5">
<div class="h-full rounded-full bg-primary" style="width: 45%;"></div>
</div>
</div>
</div>
</div>
</div>
<!-- Summary Footer Card -->
<div class="p-4 bg-primary/10">
<div class="bg-cover bg-center flex flex-col items-stretch justify-end rounded-lg pt-[60px] relative overflow-hidden" data-alt="Abstract purple geometric pattern background" style='background-image: linear-gradient(180deg, rgba(127, 19, 236, 0.2) 0%, rgba(127, 19, 236, 0.8) 100%), url("https://lh3.googleusercontent.com/aida-public/AB6AXuCv4oNF_ZMDzLdMZ-JGkK9y2ON3f3k5ChSVdtVjUicw517A8hhNKQTlVwl5bbihI2lzHZyRMw3yLXkOLXB2RDMpnm9Jyc2KI1P6sbytMts8-xuQk6MdemnJuVFRU4uvURogJf207vA6GJM6JBOAMapc0gNmpfJTTIEPXGPP1VroGQwoP2uYBxoHJu3MpfqfKrApmezhgpTY3bEOawViwE1nQ_hZmnWxI3XZn8y9pbxHcecqMySa14J0K-imYdL6NfnQvOlWyX99sHY");'>
<div class="flex w-full items-end justify-between gap-4 p-4 z-10">
<div class="flex max-w-[440px] flex-1 flex-col gap-0.5">
<p class="text-white tracking-tight text-lg font-bold leading-tight">Batch #204</p>
<p class="text-white/80 text-xs font-medium leading-normal">OCR Analysis in progress</p>
</div>
<button class="flex min-w-[70px] cursor-pointer items-center justify-center overflow-hidden rounded-full h-8 px-3 bg-white text-primary text-xs font-bold leading-normal transition-transform active:scale-95">
<span class="truncate">Pause</span>
</button>
</div>
</div>
</div>
</div>
<!-- Floating Pill (Collapsed View) -->
<div class="flex items-center gap-3 glass-effect px-4 py-3 rounded-full shadow-lg border border-white/10 cursor-pointer hover:bg-white/10 transition-all duration-300 w-fit">
<div class="relative flex items-center justify-center shrink-0">
<div class="size-6 border-2 border-primary/30 rounded-full border-t-primary animate-spin-slow"></div>
<span class="absolute text-[10px] text-primary font-bold">3</span>
</div>
<div class="flex flex-col">
<p class="text-white text-sm font-bold leading-tight">Processing 3 receipts...</p>
<p class="text-[#ab9db9] text-[10px] font-medium leading-none">Estimated: 12 seconds</p>
</div>
<div class="ml-2 pl-2 border-l border-white/10 flex items-center gap-1 text-[#ab9db9]">
<span class="material-symbols-outlined text-lg">expand_more</span>
</div>
</div>
</div>
</body></html>
