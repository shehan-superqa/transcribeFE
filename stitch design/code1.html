<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fiscally - Loading...</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#6366f1", // Using the vibrant purple from the UI
              "background-light": "#f9fafb",
              "background-dark": "#0f172a",
            },
            fontFamily: {
              display: ["Inter", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
            },
            animation: {
              'flow-in': 'flow-in 2s ease-in-out infinite',
              'pulse-soft': 'pulse-soft 2s ease-in-out infinite',
              'fade-in-up': 'fade-in-up 0.5s ease-out forwards',
            },
            keyframes: {
              'flow-in': {
                '0%': { transform: 'translateY(10px)', opacity: '0' },
                '50%': { transform: 'translateY(0)', opacity: '1' },
                '100%': { transform: 'translateY(-10px)', opacity: '0' },
              },
              'pulse-soft': {
                '0%, 100%': { opacity: '1' },
                '50%': { opacity: '0.6' },
              },
              'fade-in-up': {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              }
            }
          },
        },
      };
    </script>
<style>
      .progress-glow {
        box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      @keyframes shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
      .shimmer-bg {
        position: relative;
        overflow: hidden;
      }
      .shimmer-bg::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        animation: shimmer 1.5s infinite;
      }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display flex flex-col items-center justify-center min-h-screen overflow-hidden transition-colors duration-500">
<div class="fixed top-12 flex items-center gap-3 opacity-90">
<div class="bg-primary p-2 rounded-xl text-white">
<span class="material-symbols-outlined text-2xl">account_balance_wallet</span>
</div>
<span class="text-2xl font-semibold tracking-tight text-slate-900 dark:text-white">Fiscally</span>
</div>
<div class="flex flex-col items-center justify-center w-full max-w-md px-6">
<div class="relative w-32 h-32 mb-12 flex items-center justify-center">
<div class="absolute inset-0 bg-primary/10 dark:bg-primary/20 rounded-full blur-3xl animate-pulse-soft"></div>
<div class="relative z-10 bg-white dark:bg-slate-800 p-6 rounded-3xl shadow-2xl border border-slate-100 dark:border-slate-700">
<span class="material-symbols-outlined text-primary text-5xl">lock</span>
</div>
<div class="absolute -top-8 flex space-x-4">
<div class="animate-flow-in" style="animation-delay: 0s;">
<span class="material-symbols-outlined text-primary/60 dark:text-primary/80 text-lg">attach_money</span>
</div>
<div class="animate-flow-in" style="animation-delay: 0.4s;">
<span class="material-symbols-outlined text-primary/40 dark:text-primary/60 text-lg">receipt_long</span>
</div>
<div class="animate-flow-in" style="animation-delay: 0.8s;">
<span class="material-symbols-outlined text-primary/50 dark:text-primary/70 text-lg">trending_up</span>
</div>
</div>
</div>
<div class="w-full space-y-4">
<div class="flex justify-between items-end mb-1">
<span class="text-xs font-medium uppercase tracking-wider text-slate-400 dark:text-slate-500">Securing your data</span>
<span class="text-xs font-semibold text-primary" id="progress-text">64%</span>
</div>
<div class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-full overflow-hidden">
<div class="h-full bg-primary progress-glow shimmer-bg rounded-full transition-all duration-500 ease-out" id="progress-bar" style="width: 64%">
</div>
</div>
</div>
</div>
<div class="fixed bottom-16 left-0 right-0 flex flex-col items-center px-8">
<div class="max-w-xs text-center space-y-2 animate-fade-in-up">
<div class="flex justify-center mb-3">
<span class="material-symbols-outlined text-primary/60 dark:text-primary/40 text-xl">lightbulb</span>
</div>
<h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Financial Wisdom</h3>
<p class="text-sm font-light leading-relaxed text-slate-600 dark:text-slate-400 transition-opacity duration-500" id="wisdom-text">
                "An investment in knowledge pays the best interest." — Benjamin Franklin
            </p>
</div>
</div>
<script>
        // Progress bar simulation
        let progress = 0;
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        function updateProgress() {
            if (progress < 100) {
                progress += Math.random() * 8;
                if (progress > 100) progress = 100;
                progressBar.style.width = `${progress}%`;
                progressText.innerText = `${Math.floor(progress)}%`;
                setTimeout(updateProgress, 600 + Math.random() * 400);
            }
        }
        // Tips rotation
        const tips = [
            "\"An investment in knowledge pays the best interest.\" — Benjamin Franklin",
            "\"Do not save what is left after spending, but spend what is left after saving.\" — Warren Buffett",
            "\"Beware of little expenses; a small leak will sink a great ship.\" — Benjamin Franklin",
            "\"The goal isn't more money. The goal is living life on your terms.\" — Chris Brogan",
            "\"Rich people have small TVs and big libraries, and poor people have small libraries and big TVs.\""
        ];
        let currentTip = 0;
        const wisdomText = document.getElementById('wisdom-text');
        setInterval(() => {
            wisdomText.style.opacity = '0';
            setTimeout(() => {
                currentTip = (currentTip + 1) % tips.length;
                wisdomText.innerText = tips[currentTip];
                wisdomText.style.opacity = '1';
            }, 500);
        }, 5000);
        // Dark mode toggle listener (for testing in preview environments)
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        // Start progress
        setTimeout(updateProgress, 800);
    </script>

</body></html>
